<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agregar vehículo</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5"><div class="card shadow-sm border-0 mx-auto" style="max-width:520px"><div class="card-body"><h1 class="h4">Agregar vehículo</h1><p class="text-secondary">Vivienda {{ vivienda.numero }} - {{ vivienda.propietario }}</p><form method="post">{% csrf_token %}<input class="form-control mb-3" name="patente" placeholder="Patente" required><input class="form-control mb-3" name="marca" placeholder="Marca"><input class="form-control mb-3" name="modelo" placeholder="Modelo"><input class="form-control mb-3" name="color" placeholder="Color"><button class="btn btn-success">Guardar vehículo</button> <a class="btn btn-secondary" href="{% url 'detalle-vivienda' vivienda.id %}">Cancelar</a></form></div></div></main></body></html>
