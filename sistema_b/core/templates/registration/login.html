<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingreso | Sistema B</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-success-subtle"><main class="container min-vh-100 d-flex align-items-center justify-content-center"><div class="card shadow border-0 p-4" style="max-width:420px;width:100%"><h1 class="h3 text-center">🏠 Sistema B</h1>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="tipo_usuario" id="tipo_usuario" value="usuario"><div class="btn-group w-100 mb-3"><button type="button" class="btn btn-outline-success" onclick="seleccionar('usuario','usuario','usuario123',this)">Usuario</button><button type="button" class="btn btn-outline-success" onclick="seleccionar('administrador','admin','admin123',this)">Administrador</button></div><input id="campo-usuario" class="form-control mb-3" name="usuario" placeholder="Usuario" required><input id="campo-clave" class="form-control mb-3" type="password" name="contrasena" placeholder="Contraseña" required><button class="btn btn-success w-100">Ingresar</button></form></div></main><script>function seleccionar(t,u,c,b){document.getElementById('tipo_usuario').value=t;document.getElementById('campo-usuario').value=u;document.getElementById('campo-clave').value=c;document.querySelectorAll('.btn-group button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}</script></body></html>
